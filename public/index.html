body::after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.55),rgba(10,8,6,.82));z-index:-1}
main{max-width:520px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:2rem;margin:6px 0 2px;text-align:center;letter-spacing:.5px}
.tag{text-align:center;color:var(--mute);margin:0 0 18px;font-size:.92rem}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;border:0;font-size:2.4rem;line-height:1;color:#6b625a;cursor:pointer;padding:2px;transition:transform .15s,color .15s}
.stars button.on{color:#ffc21a}
.stars button:active{transform:scale(1.2)}
.lbl{text-align:center;color:var(--mute);font-size:.9rem;margin-top:8px;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;color:#fff;background:var(--acc);text-align:center;text-decoration:none;margin-top:10px}
.btn.alt{background:rgba(255,255,255,.12);border:1px solid var(--line)}
.btn.g{background:#1a73e8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{width:100%;min-height:150px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;font-size:.98rem;line-height:1.5;padding:12px}
.hint{color:var(--mute);font-size:.8rem;margin:8px 0 0;text-align:center}
.hide{display:none}
</style></head>

var OP={p:["Had dinner at {n} with family.","Visited {n} last weekend.","Dropped in on a whim and glad I did.","Went with friends yesterday.","Stopped by {n} after a long day.","Been wanting to try {n} for a while.","Second time here."],
m:["Visited {n} recently.","Went to {n} with a friend.","Tried {n} this week.","Stopped by {n} for a meal."],
n:["Visited {n} recently and left disappointed.","Wanted to like {n} but.","Went to {n} last week.","Sad to say this about {n}."]};
var CL={p:["Thank you team!","Highly recommend.","Will be back soon.","Do try it once.","Keep it up!","Great job {n}.","Loved it."],
m:["Hope they improve.","Might give it another try.","Okay for a casual visit.","Decent, not amazing."],
n:["Hope management looks into this.","Expected much better.","Won’t be returning soon.","Needs a lot of improvement."]};
var EX=["Parking was easy too.","Reached around evening time.","Sat near the window.","Went on a weekday.","Overall that’s my experience.","Just sharing honestly.","This is my honest take.","Ordered a few things to share."];
var star=0,sel=[],$=function(i){return document.getElementById(i)};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function tier(){return star>=4?"p":star==3?"m":"n"}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function used(){try{return JSON.parse(localStorage.getItem("rb_used")||"[]")}catch(e){return[]}}
var mem=used();
function save(t){mem.push(t);if(mem.length>800)mem=mem.slice(-800);try{localStorage.setItem("rb_used",JSON.stringify(mem))}catch(e){}}
function build(){
 var t=tier(),keys=sel.slice().sort(function(){return Math.random()-.5}).slice(0,4),s="";
 if(Math.random()<.55)s+=pick(OP[t]).replace("{n}",NAME)+" ";
 keys.forEach(function(k,i){
  var ph=pick(K[star].filter(function(x){return x[0]==k})[0][1]);
  if(i==0)s+=cap(ph);
  else{var c=pick([". ",". ",", and ",". Also, ",". Plus "]);s+=c+(c.charAt(0)==","?ph:cap(ph))}
 });
 s+=".";
 if(Math.random()<.3)s+=" "+pick(EX);
 if(Math.random()<.6)s+=" "+pick(CL[t]).replace("{n}",NAME);
 if(t=="p"&&Math.random()<.25)s=s.replace(/\.$/,"!");
 if(Math.random()<.2)s=s.replace(/[.!]$/,"");
 return s;
}
function fresh(){
 var r,n=0;
 do{r=build();n++}while(mem.indexOf(r)>-1&&n<80);
 while(mem.indexOf(r)>-1){r+=" "+pick(EX)}
 save(r);return r;
}
function renderStars(){
 var h="";for(var i=1;i<=5;i++)h+='<button type="button" aria-label="'+i+' stars" class="'+(i<=star?"on":"")+'" data-s="'+i+'">★</button>';
 $("stars").innerHTML=h;
 $("lbl").textContent=star?LBL[star]:"Tap a star";
}
function renderChips(){
 $("chips").innerHTML=K[star].map(function(k){return '<button type="button" class="chip'+(sel.indexOf(k[0])>-1?" on":"")+'" data-k="'+k[0]+'">'+k[0].replace("&","&amp;")+'</button>'}).join("");
 $("gen").disabled=!sel.length;
}
$("name").textContent=NAME;
renderStars();
$("stars").onclick=function(e){var b=e.target.closest("button");if(!b)return;star=+b.dataset.s;sel=[];renderStars();renderChips();$("kwCard").classList.remove("hide");$("outCard").classList.add("hide")};
$("chips").onclick=function(e){var b=e.target.closest("button");if(!b)return;var k=b.dataset.k,i=sel.indexOf(k);if(i>-1)sel.splice(i,1);else sel.push(k);renderChips()};
function gen(){$("out").value=fresh();$("outCard").classList.remove("hide");$("copy").textContent="Copy"}
$("gen").onclick=function(){gen();$("outCard").scrollIntoView({behavior:"smooth",block:"start"})};
$("again").onclick=gen;
$("copy").onclick=function(){
 var t=$("out").value,done=function(){$("copy").textContent="Copied ✓"};
 function fb(){var o=$("out");o.focus();o.select();try{document.execCommand("copy");done()}catch(e){}}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();
};
